# Publishes the dev log (devlog/, a static page) to GitHub Pages: https://badsadcode.github.io/river/
name: Dev log

on:
  push:
    paths:
      - "devlog/**"
      - ".github/workflows/devlog.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two jobs (GitHub's own pattern): in one job the deploy step sometimes looked for the uploaded page before
  # GitHub had registered it ("No artifacts named github-pages were found").
  build:
    # Only the default branch publishes.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: devlog

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
